<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lingyin Zhang — Photography</title>
<meta name="description" content="Film and Polaroid photography by Lingyin Zhang, New York City.">
<meta property="og:title" content="Lingyin Zhang — Photography">
<script>
  // set the theme before anything draws, so the page never flashes the wrong colour
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="name" href="#/">Lingyin Zhang</a>
    <nav>
      <a href="#/film" data-nav="film">Film</a>
      <a href="#/polaroid" data-nav="polaroid">Polaroid</a>
      <a href="#/about" data-nav="about">About</a>
      <button class="toggle" id="toggle" aria-label="Switch between light and dark"></button>
    </nav>
  </header>

  <main id="main"></main>

  <footer>© <span id="year"></span> Lingyin Zhang</footer>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lb-close" aria-label="Close">×</button>
    <div class="lb-stage" id="lb-stage">
      <button class="lb-arrow lb-prev" id="lb-prev" aria-label="Previous photo">‹</button>
      <img id="lb-img" alt="">
      <button class="lb-arrow lb-next" id="lb-next" aria-label="Next photo">›</button>
    </div>
    <div class="lb-meta"><span id="lb-title"></span><span id="lb-count"></span></div>
    <div class="lb-strip" id="lb-strip"></div>
    <div class="lb-progress" id="lb-progress"><div id="lb-bar"></div></div>
  </div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
